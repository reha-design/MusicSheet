[project]
name = "musicsheet-api"
version = "0.1.0"
description = "FastAPI gateway and infrastructure health checks for MusicSheet"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "celery>=5.6.3,<5.7",
    "fastapi>=0.141.1",
    "musicsheet-common",
    "musicsheet-storage",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
musicsheet-api = "musicsheet_api.app:run"
musicsheet-migrate = "musicsheet_api.migrations.cli:main"
musicsheet-orchestration-maintenance = "musicsheet_api.pipeline.maintenance:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
musicsheet-common = { path = "../../packages/common", editable = true }
musicsheet-storage = { path = "../../packages/storage", editable = true }

[tool.pytest.ini_options]
markers = ["integration: requires marked disposable PostgreSQL database"]
