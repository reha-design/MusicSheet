[project]
name = "musicsheet"
version = "0.1.0"
description = "AI-based audio source separation and automatic sheet music transcription system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "musicsheet-common",
    "musicsheet-storage",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.workspace]
members = ["packages/common", "packages/storage"]

[tool.uv.sources]
musicsheet-common = { workspace = true }
musicsheet-storage = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
