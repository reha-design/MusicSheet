[project]
name = "musicsheet-common"
version = "0.1.0"
description = "Core domain schemas and contracts for MusicSheet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musicsheet_common"]
