[project]
name = "musicsheet-pipeline"
version = "0.1.0"
description = "Durable stage orchestration for MusicSheet"
requires-python = ">=3.13,<3.14"
dependencies = ["musicsheet-common", "musicsheet-storage", "asyncpg>=0.31.0", "redis>=6.4.0,<6.5", "celery[redis]>=5.6,<6", "mido==1.3.3"]

[project.scripts]
musicsheet-dispatch = "musicsheet_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musicsheet_pipeline"]
