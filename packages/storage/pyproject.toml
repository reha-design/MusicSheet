[project]
name = "musicsheet-storage"
version = "0.1.0"
description = "Artifact storage adapters for MusicSheet"
requires-python = ">=3.13,<3.14"
dependencies = [
    "musicsheet-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musicsheet_storage"]
